- name: Host for running
  hosts: workers:masternode
  become: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - common
    - containerd

- name: control plan configuration
  hosts: masternode
  become: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - control-plan

- name: join workernodes
  hosts: workers
  become: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - workernode