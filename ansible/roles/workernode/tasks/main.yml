---
# tasks file for workernode
- name: check worker join or not
  become: true
  ansible.builtin.stat:
    path: "{{ kubelet_config_path }}"
  register: kubelet_config

- name: join worker node
  become: true
  ansible.builtin.command:
    cmd: "{{ hostvars[groups[control_plane_group][0]].kubeadm_join_command }}"
  when: not kubelet_config.stat.exists

- name: create .kube folder
  ansible.builtin.file:
    path: "{{ kube_config_folder_path }}"
    owner: ubuntu
    group: ubuntu
    state: directory
  tags: copyfile

- name: copy kubeconfig file
  ansible.builtin.copy:
    src: "{{ src_path_copy_kube_config_file }}"
    dest: "{{ dest_path_copy_kube_config_file }}"
  tags: copyfile
