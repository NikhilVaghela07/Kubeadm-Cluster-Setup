---
common_packages:
  - ca-certificates
  - curl
  - gpg
kubernetes_version: "v1.37"
modules_file: /etc/modules-load.d/k8s.conf
sysctl_file: /etc/sysctl.d/k8s.conf
keyrings_directory: /etc/apt/keyrings
release_key_path: /tmp/kubernetes-release.key
keyring_path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
repository_filename: kubernetes
kubernetes_packages:
  - kubelet
  - kubeadm
  - kubectl
kubelet_service_name: kubelet
