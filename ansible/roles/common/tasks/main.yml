---
# tasks file for common
- name: install common packages
  become: true
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true

- name: Loads Kernal modules overplay and br_netfilter  
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: "{{ modules_file }}"
    mode: '0644'
  become: true
  notify: Load kernal modules

- name: kernal parametes for kubernetes
  ansible.builtin.copy:
    dest: "{{ sysctl_file }}"
    mode: "0644"
    content: | 
      net.bridge.bridge-nf-call-iptables  = 1  
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  notify: reload kernal parameter without reboot

- name: apply kubernetes kernel parameters immediately
  become: true
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: verify IPv4 forwarding is enabled
  become: true
  ansible.builtin.command:
    cmd: sysctl -n net.ipv4.ip_forward
  register: ipv4_forwarding
  changed_when: false
  failed_when: ipv4_forwarding.stdout | trim != "1"

# Kubernetes resource downlaod
- name: create apt ketring dircory
  become: true
  ansible.builtin.file:
    path: "{{ keyrings_directory }}"
    state: directory
    mode: "0755"

- name: kuberentes signing key downlaod
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key"
    dest: "{{ release_key_path }}"
    mode: "0644"

- name: install kubernetes repository signing kery
  become: true
  ansible.builtin.command:
    cmd: "gpg --dearmor --yes -o {{ keyring_path }} {{ release_key_path }}"
  args:
    creates: "{{ keyring_path }}"

- name: kuberntes apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ keyring_path }}] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /"
    filename: "{{ repository_filename }}"
    state: present

- name: kubernetes packages
  become: true
  ansible.builtin.apt:
    name: "{{ kubernetes_packages }}"

- name: kubernetes packages on hold
  become: true
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_packages }}"


- name: enable kubelt
  become: true
  ansible.builtin.systemd:
    name: "{{ kubelet_service_name }}"
    enabled: true