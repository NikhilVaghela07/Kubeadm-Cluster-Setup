---
# tasks file for common
- name: install common packages
  become: true
  ansible.builtin.apt:
    name: 
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: true

- name: Loads Kernal modules overplay and br_netfilter  
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'
  become: true
  notify: Load kernal modules

- name: kernal parametes for kubernetes
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    mode: "0644"
    content: | 
      net.bridge.bridge-nf-call-iptables  = 1  
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  notify: reload kernal parameter without reboot